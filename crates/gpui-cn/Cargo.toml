[package]
name = "gpui-cn"
description = "shadcn-style components for GPUI, built on gpui-base."
keywords = ["gpui", "ui", "shadcn", "components", "desktop"]
categories = ["gui"]
readme = "../../README.md"
documentation = "https://docs.rs/gpui-cn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds with every feature, so the font and the test helpers
# show in the documentation.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# JetBrains Mono as the code font, registered by `init`.
jetbrains-mono = ["dep:damascene-fonts-jetbrains-mono"]
# The terminal in `gpui_cn::terminal`, on libghostty-vt. Building it needs
# Zig 0.16; see the `ghostty-vt-sys` crate.
ghostty = ["dep:ghostty-vt", "dep:libc"]
# A local pty for the terminal, on desktop targets.
ghostty-pty = ["ghostty", "dep:portable-pty"]
# Headless UI testing through `gpui_kit::test`.
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { workspace = true, features = ["assets"] }
damascene-fonts-jetbrains-mono = { version = "0.1", optional = true }
nucleo-matcher = "0.3"
smol = "2"
ghostty-vt = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# The passwd entry, for the user's default shell.
libc = { version = "0.2", optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
portable-pty = { version = "0.9", optional = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
