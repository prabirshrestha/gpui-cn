[package]
name = "gpui-cn-story"
description = "Component gallery for gpui-cn."
publish = false
default-run = "gpui-cn-story"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["gpui-fast", "terminal"]
# GPUI Fast as the backend, for the gallery and the FPS HUD.
gpui-fast = ["gpui-cn/gpui-fast", "gpui-fps?/gpui-fast"]
# The Terminal story: a shell in a pty through `gpui_cn::terminal`.
# Building it needs Zig 0.16.
terminal = ["gpui-cn/ghostty"]
# `snapshot`: render the gallery offscreen (Metal, macOS) to PNG files.
snapshot = ["gpui-kit/test-support", "gpui-cn/test-support", "dep:image", "dep:libc"]
# `fps`: the gpui-fps HUD, toggled with Cmd-Shift-P (Ctrl-Shift-P).
fps = ["dep:gpui-fps"]

[dependencies]
gpui-cn = { workspace = true, features = ["jetbrains-mono"] }
gpui-kit = { workspace = true, features = ["assets"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gpui-fps = { version = "0.8.1", optional = true }
# The benchmark reads this process' CPU time.
libc = { version = "0.2", optional = true }

# The tests drive headless windows and find elements by id.
[dev-dependencies]
gpui-cn = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }

[[bin]]
name = "snapshot"
required-features = ["snapshot"]

[[bin]]
name = "bench"
required-features = ["snapshot"]

# The story lists a fixed set of files only in the snapshot build.
[[test]]
name = "file_picker_story"
required-features = ["snapshot"]
