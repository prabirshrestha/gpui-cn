[workspace]
members = ["crates/gpui-cn", "crates/gpui-cn-story"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/prabirshrestha/gpui-cn"
homepage = "https://github.com/prabirshrestha/gpui-cn"

[workspace.dependencies]
gpui-cn = { path = "crates/gpui-cn", version = "0.1.0" }
gpui-kit = { version = "0.6.4", default-features = false }

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.lints.rust]
missing_docs = "warn"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
