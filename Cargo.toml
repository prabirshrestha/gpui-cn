[workspace]
members = [
    "crates/ghostty-vt-sys",
    "crates/ghostty-vt",
    "crates/gpui-cn",
    "crates/gpui-cn-story",
]
# `cargo run` at the root opens the gallery.
default-members = ["crates/gpui-cn", "crates/gpui-cn-story"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/prabirshrestha/gpui-cn"
homepage = "https://github.com/prabirshrestha/gpui-cn"

[workspace.metadata.ghostty]
# `scripts/sync.sh <commit> <version>` changes this to `independent` when the
# requested engine core differs from gpui-cn.
version-mode = "follow-gpui-cn"

[workspace.dependencies]
gpui-cn = { path = "crates/gpui-cn", version = "0.5.0" }
# The terminal crates normally follow gpui-cn's SemVer core. Their package
# versions append the pinned Ghostty version and commit as build metadata.
ghostty-vt-sys = { path = "crates/ghostty-vt-sys", version = "0.5.0" }
ghostty-vt = { path = "crates/ghostty-vt", version = "0.5.0" }
gpui-kit = { version = "0.7.1", default-features = false }

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.lints.rust]
missing_docs = "warn"

# The gallery is what users run; a smaller binary loads faster from the
# Dock and one codegen unit lets the layout engine inline across crates.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Skip dsymutil on macOS: it is slow and warns about incremental objects a
# rebuild removed. Debug info stays in the object files for lldb.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
