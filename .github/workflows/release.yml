name: Release

# Publishes a version tag through crates.io Trusted Publishing.
#
# - `v<version>` publishes gpui-cn at the workspace version.
# - `ghostty-vt-v<version>` publishes ghostty-vt-sys, then ghostty-vt, at
#   their own version. Release the engine before a gpui-cn version that
#   needs it.
#
# Manual runs use the current workflow to recover an existing release tag.
on:
  push:
    tags: ["v*", "ghostty-vt-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Pick the crates for the release tag
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          case "$RELEASE_TAG" in
            ghostty-vt-v*)
              echo "CRATES=ghostty-vt-sys ghostty-vt" >> "$GITHUB_ENV"
              echo "VERSION=${RELEASE_TAG#ghostty-vt-v}" >> "$GITHUB_ENV"
              ;;
            v*)
              echo "CRATES=gpui-cn" >> "$GITHUB_ENV"
              echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "expected v<version> or ghostty-vt-v<version>"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Check the release commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          echo "Release tag $RELEASE_TAG resolves to $sha"
          gh run list --workflow ci.yml --branch main --commit "$sha" \
            --json conclusion --jq 'any(.[]; .conclusion == "success")' |
            grep -qx true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check the tag against the versions
        run: |
          for crate in $CRATES; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            test "$version" = "$VERSION" || { echo "tag $RELEASE_TAG is not version $version of $crate"; exit 1; }
          done
      - name: Build the publish arguments
        run: echo "PACKAGES=$(printf -- '-p %s ' $CRATES)" >> "$GITHUB_ENV"
      - run: cargo publish $PACKAGES --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Cargo publishes ghostty-vt-sys before ghostty-vt, which depends
      # on it.
      - run: cargo publish $PACKAGES --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
