name: Release

# Publishes the workspace on a `v<version>` tag, where the version is
# gpui-cn's: ghostty-vt-sys, then ghostty-vt, then gpui-cn, in dependency
# order. A crate whose version is already on crates.io is skipped, so the
# engine crates keep their own versions and publish only when bumped.
#
# Publishing goes through crates.io Trusted Publishing. Trusted Publishing
# cannot create a crate, so the first release of a new crate needs a
# CARGO_REGISTRY_TOKEN repository secret, which this workflow uses instead
# when it is set. Remove the secret once every crate exists.
#
# Manual runs use the current workflow to recover an existing release tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Validate the release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "expected a version tag"; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Check the release commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          echo "Release tag $RELEASE_TAG resolves to $sha"
          gh run list --workflow ci.yml --branch main --commit "$sha" \
            --json conclusion --jq 'any(.[]; .conclusion == "success")' |
            grep -qx true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check the tag against gpui-cn's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gpui-cn") | .version')
          test "v$version" = "$RELEASE_TAG" || { echo "tag $RELEASE_TAG is not v$version"; exit 1; }
      - name: Pick the crates whose version is not on crates.io
        run: |
          packages=""
          for crate in ghostty-vt-sys ghostty-vt gpui-cn; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "gpui-cn release (https://github.com/prabirshrestha/gpui-cn)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already published"
            else
              echo "$crate $version will be published"
              packages="$packages -p $crate"
            fi
          done
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      # Cargo publishes the picked crates in dependency order and waits for
      # each to be available before the next.
      - name: Dry run
        if: env.PACKAGES != ''
        run: cargo publish $PACKAGES --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        if: env.PACKAGES != '' && env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: env.PACKAGES != ''
        run: cargo publish $PACKAGES --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
