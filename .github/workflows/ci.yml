name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc -p gpui-cn -p ghostty-vt -p ghostty-vt-sys --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  bindings:
    name: Ghostty bindings are current
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Regenerate the bindings from the pinned headers
        run: cargo run -p ghostty-vt-sys --features bindgen-tool --bin gen-bindings --locked
        env:
          DOCS_RS: "1"
      - run: git diff --exit-code -- crates/ghostty-vt-sys/src/bindings.rs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: rui314/setup-mold@v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1
      - run: cargo test --workspace --all-features --locked

  ios:
    name: Check the engine (aarch64-apple-ios-sim)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios-sim
      - run: cargo check -p ghostty-vt-sys -p ghostty-vt --all-features --locked --target aarch64-apple-ios-sim

  download:
    name: Build the engine without the submodule (tarball download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: test ! -f vendor/ghostty/build.zig
      - run: cargo test -p ghostty-vt-sys -p ghostty-vt --all-features --locked

  system-dir:
    name: Build the engine with GHOSTTY_ZIG_SYSTEM_DIR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the Zig packages once and extract them for --system
        run: |
          cd vendor/ghostty
          zig build -Demit-lib-vt -Doptimize=ReleaseFast --global-cache-dir "$RUNNER_TEMP/zig-global" --prefix "$RUNNER_TEMP/zig-out" >/dev/null
          mkdir -p "$RUNNER_TEMP/zig-pkg"
          for pkg in "$RUNNER_TEMP"/zig-global/p/*.tar.gz; do tar xzf "$pkg" -C "$RUNNER_TEMP/zig-pkg"; done
      - run: cargo build -p ghostty-vt-sys --locked
        env:
          GHOSTTY_ZIG_SYSTEM_DIR: ${{ runner.temp }}/zig-pkg

  publish-dry-run:
    name: Publish dry run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Packages ghostty-vt-sys, ghostty-vt and gpui-cn together, so
      # gpui-cn's optional dependency on ghostty-vt resolves before
      # ghostty-vt is on crates.io.
      - run: cargo publish --workspace --dry-run --locked
