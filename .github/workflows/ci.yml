name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1 libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/check-ghostty-version.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc -p gpui-cn -p ghostty-vt -p ghostty-vt-sys --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  bindings:
    name: Ghostty bindings are current
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The doc comments bindgen keeps depend on the libclang version, so
      # the bindings are generated with the same LLVM as scripts/sync.sh.
      - run: brew install llvm@22
      - name: Regenerate the bindings from the pinned headers
        run: |
          export LIBCLANG_PATH="$(brew --prefix llvm@22)/lib"
          cargo run -p ghostty-vt-sys --features bindgen-tool --bin gen-bindings --locked
          cargo fmt -p ghostty-vt-sys
        env:
          DOCS_RS: "1"
      - run: git diff --exit-code -- crates/ghostty-vt-sys/src/bindings.rs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # macOS links the prebuilt libghostty-vt, so it runs without Zig.
      - uses: mlugg/setup-zig@v2
        if: runner.os != 'macOS'
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: rui314/setup-mold@v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1 libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: cargo test --workspace --all-features --locked

  ios:
    name: Check the engine (aarch64-apple-ios-sim, prebuilt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios-sim
      - run: cargo check -p ghostty-vt-sys -p ghostty-vt --all-features --locked --target aarch64-apple-ios-sim

  windows-gnu:
    name: Test the engine (x86_64-pc-windows-gnu, prebuilt static)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu
      - run: cargo test -p ghostty-vt-sys -p ghostty-vt --all-features --locked --target x86_64-pc-windows-gnu

  windows-msvc-prebuilt:
    name: Test the engine (x86_64-pc-windows-msvc, prebuilt static, rust-lld)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GHOSTTY_VT_PREBUILT_MSVC: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # Puts the MSVC and Windows SDK library directories in LIB for lld.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
      - run: cargo test -p ghostty-vt-sys -p ghostty-vt --all-features --locked --target x86_64-pc-windows-msvc

  macos-source:
    name: Build the engine from source on macOS (GHOSTTY_VT_FROM_SOURCE)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test -p ghostty-vt-sys -p ghostty-vt --all-features --locked
        env:
          GHOSTTY_VT_FROM_SOURCE: "1"

  download:
    name: Build the engine without the submodule (release tarballs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: test ! -f third_party/ghostty/build.zig
      - run: cargo test -p ghostty-vt-sys -p ghostty-vt --all-features --locked

  system-dir:
    name: Build the engine with GHOSTTY_ZIG_SYSTEM_DIR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Unpack the release deps tarball for --system
        run: |
          release=$(sed -n 's/^release = //p' crates/ghostty-vt-sys/GHOSTTY.lock)
          deps=$(sed -n 's/^deps = //p' crates/ghostty-vt-sys/GHOSTTY.lock)
          sum=$(sed -n 's/^deps_sha256 = //p' crates/ghostty-vt-sys/GHOSTTY.lock)
          root=$(sed -n 's/^deps_root = //p' crates/ghostty-vt-sys/GHOSTTY.lock)
          curl -fsSL "$release/$deps" -o "$RUNNER_TEMP/$deps"
          echo "$sum  $RUNNER_TEMP/$deps" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$deps" -C "$RUNNER_TEMP"
          echo "GHOSTTY_ZIG_SYSTEM_DIR=$RUNNER_TEMP/$root" >> "$GITHUB_ENV"
      - run: cargo build -p ghostty-vt-sys --locked

  publish-dry-run:
    name: Publish dry run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Packages ghostty-vt-sys, ghostty-vt and gpui-cn together, so
      # gpui-cn's optional dependency on ghostty-vt resolves before
      # ghostty-vt is on crates.io.
      - run: cargo publish --workspace --dry-run --locked
