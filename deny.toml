# cargo deny: the licenses this repository accepts.
#
# Run `cargo deny check licenses`. CI runs it too. A crate that is only
# available under the GPL or the LGPL fails the check. A crate that offers
# a permissive license beside a GPL one passes, because the permissive
# option is the one used.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OFL-1.1",
    "Unlicense",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
